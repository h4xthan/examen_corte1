# Cabeceras de seguridad, en un snippet aparte porque nginx tiene una regla que
# surprising: un `add_header` dentro de un `location` descarta todos los
# `add_header` del bloque padre. Poner estas cabeceras solo en `server` dejaría
# /assets/ y /index.html —los dos bloques que añaden Cache-Control— sin CSP, sin
# nosniff y sin frame-ancestors, que es justo donde un bundle cacheado para
# siempre importa más. Incluir el mismo fichero en los tres sitios hace que no
# puedan divergir.
#
# Sin 'unsafe-inline' a propósito: el build de Vite 5 no emite <script> ni
# <style> en línea, así que no hace falta. style-src nombra a Google Fonts porque
# el <link> de index.html lo carga desde ahí, y los dos dominios quedan
# explícitos en vez de caer en un comodín.
#
# frame-ancestors solo funciona como cabecera: se ignora en un <meta>, que es lo
# que hay en index.html como red de seguridad para cuando la app se sirve sin
# nginx (npm run dev, otro servidor, un tests).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

# COOP aísla la ventana de las páginas que se abren desde aquí, que es el
# enlace "Ver imagen adjunta" con target=_blank. CORP evita que otro sitio use
# nuestra API para inspeccionar respuestas cruzadas.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
