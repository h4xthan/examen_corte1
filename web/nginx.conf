# Las navegaciones del navegador envían Accept: text/html; las llamadas API
# (fetch/curl/Burp) envían Accept: */*. Sin esto, hacer F5 en rutas SPA que
# colisionan con la API (/admin) proxea la PÁGINA al backend y el navegador
# muestra el error JSON en vez de la app.
map $http_accept $spa_navigation {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El handler de upload acepta hasta 5 MiB de imagen más el sobre multipart;
    # 6m deja margen sin convertir esto en una puerta abierta.
    client_max_body_size 6m;

    # Las cabeceras de seguridad viven en un snippet. nginx descarta los
    # add_header del padre en cuanto un location declara los suyos, así que los
    # locations que añaden Cache-Control tienen que incluirlas también; si no,
    # /assets/ y /index.html quedarían sin CSP.
    include /etc/nginx/conf.d/security-headers.conf;

    # Los assets llevan hash en el nombre, así que son inmutables. index.html no
    # lo es: sin esto un cliente cachearía el HTML con los hashes viejos y la
    # app pediría bundles que ya no existen.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Rutas de la API → contenedor api:8000
    location ~ ^/(books|auth|users|orders|order-items|checkout|reviews|coupons|payment-methods|addresses|admin|uploads)(/|$) {
        # F5/navegación a una ruta SPA que colisiona con la API → servir la app
        if ($spa_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El limitador de peticiones necesita la IP real del cliente, no la del
        # proxy. Sin esta cabecera, todas las peticiones de la tienda llegan
        # desde la IP del contenedor nginx y comparten un único cubo: un usuario
        # puede agotar el límite de todos los demás con un bucle.
        #
        # $proxy_add_x_forwarded_for añade la IP que ya venía en la cadena en vez
        # de reemplazarla. El servidor sólo la usa si nginx está en
        # TRUSTED_PROXIES; fuera de esa lista la descarta, así que un cliente que
        # se mande a sí mismo una cabecera falsa no elige con qué cubo se le
        # cuenta. X-Forwarded-For no está en la allowlist del proxy: nginx la
        # construye.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA: todo lo demás sirve index.html
    location / {
        try_files $uri /index.html;
    }
}
