version: "2"
sql:
  - engine: "mysql"
    schema:
      - "cmd/migrate/migrations/000001_init.up.sql"
      - "cmd/migrate/migrations/000002_panel.up.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
